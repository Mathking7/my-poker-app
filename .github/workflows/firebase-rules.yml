name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/firebase-rules.yml

permissions:
  contents: read

# Firebase rules are deployed by GitHub Actions because Vercel only builds the static app.
jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: staging
            project_id: mypoker-staging
            service_account_secret: FIREBASE_STAGING_SERVICE_ACCOUNT_JSON
          - name: production
            project_id: mypoker-e6f9c
            service_account_secret: FIREBASE_PRODUCTION_SERVICE_ACCOUNT_JSON
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Firebase secrets
        id: firebase-secrets
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets[matrix.service_account_secret] }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Skipping Firestore rules deploy for ${{ matrix.name }} because ${{ matrix.service_account_secret }} is not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' '${{ matrix.project_id }}' | grep -Eq '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'; then
            echo "::error::Workflow matrix project_id is not a valid Firebase project ID."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.firebase-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write Firebase credentials
        if: steps.firebase-secrets.outputs.configured == 'true'
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets[matrix.service_account_secret] }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Validate Firebase credentials
        if: steps.firebase-secrets.outputs.configured == 'true'
        shell: bash
        env:
          EXPECTED_PROJECT_ID: ${{ matrix.project_id }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const file = process.env.GOOGLE_APPLICATION_CREDENTIALS;
          const expectedProjectId = process.env.EXPECTED_PROJECT_ID;
          let credentials;
          try {
            credentials = JSON.parse(readFileSync(file, 'utf8'));
          } catch {
            console.error('Firebase service account secret is not valid JSON.');
            process.exit(1);
          }

          const requiredFields = ['type', 'project_id', 'private_key', 'client_email'];
          const missingFields = requiredFields.filter((field) => !credentials[field]);
          if (missingFields.length) {
            console.error(`Firebase service account secret is missing required field(s): ${missingFields.join(', ')}`);
            process.exit(1);
          }

          if (credentials.type !== 'service_account') {
            console.error('Firebase service account secret must have type "service_account".');
            process.exit(1);
          }

          if (credentials.project_id !== expectedProjectId) {
            console.error(`Firebase service account project_id does not match ${expectedProjectId}.`);
            process.exit(1);
          }

          console.log(`Firebase service account JSON is valid for ${expectedProjectId}.`);
          NODE

      - name: Deploy Firestore rules to ${{ matrix.name }}
        if: steps.firebase-secrets.outputs.configured == 'true'
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npx --yes firebase-tools deploy --only firestore:rules --project "${{ matrix.project_id }}" --non-interactive

      - name: Remove Firebase credentials
        if: always() && steps.firebase-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
