name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/firebase-rules.yml

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: staging
            project_id_secret: FIREBASE_STAGING_PROJECT_ID
            service_account_secret: FIREBASE_STAGING_SERVICE_ACCOUNT_JSON
          - name: production
            project_id_secret: FIREBASE_PRODUCTION_PROJECT_ID
            service_account_secret: FIREBASE_PRODUCTION_SERVICE_ACCOUNT_JSON
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Firebase secrets
        id: firebase-secrets
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets[matrix.service_account_secret] }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Skipping Firestore rules deploy for ${{ matrix.name }} because ${{ matrix.project_id_secret }} or ${{ matrix.service_account_secret }} is not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          project_id="$(printf '%s' "$FIREBASE_PROJECT_ID" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s/^[A-Z_]+_PROJECT_ID=//')"
          if ! printf '%s' "$project_id" | grep -Eq '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'; then
            echo "::error::${{ matrix.project_id_secret }} is not a valid Firebase project ID. Use only the raw project ID, for example mypoker-staging or mypoker-e6f9c."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.firebase-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Write Firebase credentials
        if: steps.firebase-secrets.outputs.configured == 'true'
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets[matrix.service_account_secret] }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Firestore rules to ${{ matrix.name }}
        if: steps.firebase-secrets.outputs.configured == 'true'
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npx --yes firebase-tools deploy --only firestore:rules --project "${{ steps.firebase-secrets.outputs.project_id }}" --non-interactive

      - name: Remove Firebase credentials
        if: always() && steps.firebase-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
